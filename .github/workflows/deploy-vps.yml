name: Deploy VPS (ai-smart-router privé)

# Déploie l'API sur le VPS OVH en auto-hébergement PRIVÉ.
# Modèle « push sur master → SSH → build local → docker compose up ».
# L'API n'est jamais exposée publiquement : la vérif de santé passe par le
# loopback du VPS (127.0.0.1:8781), pas par une URL publique.
#
# Le .env de prod est CONSTRUIT côté CI à partir des GitHub Secrets, puis
# poussé sur le serveur (canal SSH chiffré, fichier en 600). Aucun login
# serveur manuel n'est requis : il suffit de renseigner les secrets ci-dessous.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   - VPS_SSH_KEY                 : clé privée SSH du VPS (OBLIGATOIRE).
#   - VPS_KNOWN_HOSTS             : empreinte de la clé d'hôte du VPS
#                                   (OBLIGATOIRE — vérification anti-MITM).
#   - AI_SMART_ROUTER_HEADER_KEY  : secret d'auth partagé (OBLIGATOIRE, ≥8 car.).
#   - Au moins UNE clé provider   : GEMINI_API_KEY / GROQ_API_KEY / NVAPI_API_KEY
#                                   / DEEPSEEK_API_KEY / OPENROUTER_API_KEY /
#                                   MISTRAL_API_KEY (ou OLLAMA_HOST).
#   - Optionnels                  : OLLAMA_API_KEY, OLLAMA_HOST, ELEVENLABS_API_KEY,
#                                   TOGETHER_API_KEY, TTS_API_KEY, TTS_API_URL,
#                                   OPENCODE_GO_API_KEY.
# Variables (optionnelles) : VPS_HOST / VPS_USER / VPS_PORT.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ai-smart-router-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST || 'vps-c4db969c.vps.ovh.ca' }}
      VPS_USER: ${{ vars.VPS_USER || 'ubuntu' }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      DEPLOY_DIR: /opt/darkmedia-x_ai-smart-router
      REPO_URL: https://github.com/jfcyberknight/darkmedia-x_ai-smart-router.git
    steps:
      - name: Configurer la clé SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Secret VPS_SSH_KEY absent — voir docs/secrets.md."
            exit 1
          fi
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::Secret VPS_KNOWN_HOSTS absent — refus de déployer sans vérification de la clé d'hôte (risque MITM sur le .env). Ajoutez l'empreinte SSH du VPS dans les GitHub Secrets."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vpsctl
          chmod 600 ~/.ssh/id_vpsctl
          printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Cloner / mettre à jour le dépôt sur le VPS
        run: |
          ssh -i ~/.ssh/id_vpsctl -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "set -e
            DIR='$DEPLOY_DIR'
            if [ ! -d \"\$DIR/.git\" ]; then
              sudo mkdir -p \"\$DIR\"
              sudo chown \$(id -u):\$(id -g) \"\$DIR\"
              git clone '$REPO_URL' \"\$DIR\"
            fi
            cd \"\$DIR\"
            git fetch --depth 1 origin master
            git reset --hard origin/master
          "

      - name: Construire le .env depuis les GitHub Secrets et le pousser (600)
        env:
          AI_SMART_ROUTER_HEADER_KEY: ${{ secrets.AI_SMART_ROUTER_HEADER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVAPI_API_KEY: ${{ secrets.NVAPI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_API_URL: ${{ secrets.TTS_API_URL }}
        run: |
          set -eu
          if [ -z "${AI_SMART_ROUTER_HEADER_KEY:-}" ]; then
            echo "::error::Secret AI_SMART_ROUTER_HEADER_KEY absent (auth) — l'ajouter dans les GitHub Secrets."
            exit 1
          fi
          umask 077
          : > env.generated
          # N'écrit que les variables réellement définies (le router n'active
          # que les providers dont la clé est présente).
          for name in \
            AI_SMART_ROUTER_HEADER_KEY \
            GEMINI_API_KEY GROQ_API_KEY NVAPI_API_KEY DEEPSEEK_API_KEY \
            OPENROUTER_API_KEY MISTRAL_API_KEY OPENCODE_GO_API_KEY \
            OLLAMA_API_KEY OLLAMA_HOST ELEVENLABS_API_KEY TOGETHER_API_KEY \
            TTS_API_KEY TTS_API_URL; do
            eval "val=\${$name:-}"
            if [ -n "$val" ]; then
              printf '%s=%s\n' "$name" "$val" >> env.generated
            fi
          done
          if ! grep -qE '^(GEMINI|GROQ|NVAPI|DEEPSEEK|OPENROUTER|MISTRAL|OPENCODE_GO)_API_KEY=' env.generated \
             && ! grep -q '^OLLAMA_HOST=' env.generated; then
            echo "::warning::Aucune clé provider définie — /api/chat renverra 503 tant qu'aucun provider n'est configuré."
          fi
          # Transfert chiffré vers le serveur (valeurs jamais affichées / en argv).
          scp -i ~/.ssh/id_vpsctl -P "$VPS_PORT" env.generated "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/.env"
          ssh -i ~/.ssh/id_vpsctl -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "chmod 600 '$DEPLOY_DIR/.env'"
          rm -f env.generated

      - name: Build + up (privé)
        id: deploy
        run: |
          set -o pipefail
          ssh -i ~/.ssh/id_vpsctl -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "set -e
            cd '$DEPLOY_DIR'
            docker network inspect dmx-net >/dev/null 2>&1 || docker network create dmx-net
            docker compose up -d --build
            docker image prune -f >/dev/null 2>&1 || true
            docker ps --filter name=dmx-ai-router
          " 2>&1 | tee /tmp/deploy-out.txt
          {
            echo "### Déploiement ai-smart-router (privé)"
            echo ""
            echo '```'
            cat /tmp/deploy-out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier la santé (loopback privé du VPS)
        run: |
          for i in 1 2 3 4 5; do
            code=$(ssh -i ~/.ssh/id_vpsctl -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8781/api/health" || echo 000)
            echo "tentative $i : HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 8
          done
          echo "::error::/api/health ne répond pas 200 sur 127.0.0.1:8781 après déploiement."
          exit 1
